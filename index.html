<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سیستەمی گۆڕەپانی بەرهەمە نەوتییەکان</title>
<style>
:root{--bg1:#120726;--bg2:#2a0f55;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--text:#f4eefc;--muted:#b6a6d4;--p1:#7b17c9;--p2:#a24cf0;--gold:#f5b53d;--bad:#ff6b8a;--ok:#4ade80;--field:rgba(0,0,0,.28)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",sans-serif;color:var(--text);background:radial-gradient(900px 500px at 85% -10%,var(--bg2),transparent 70%),var(--bg1)}
main{max-width:780px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:1.45rem;line-height:1.6;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:11px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--p2),var(--p1))}
.search{display:flex;gap:10px;padding:10px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.in{width:100%;min-width:0;background:var(--field);border:1px solid transparent;border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem;color:var(--text);outline:none;color-scheme:dark}
.in:focus{border-color:var(--p2)}
.in[readonly]{opacity:.6}
textarea.in{min-height:78px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--p2),var(--p1));white-space:nowrap}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.alt:hover{background:rgba(255,255,255,.08)}
.btn.xl{background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.45);color:var(--ok)}
.btn.xl:hover{background:rgba(74,222,128,.24)}
.btn.eye{background:rgba(245,181,61,.14);border:1px solid rgba(245,181,61,.45);color:var(--gold)}
.btn.eye.off{background:rgba(255,107,138,.14);border:1px solid rgba(255,107,138,.45);color:var(--bad)}
.btn.sm{padding:9px 14px;font-size:.9rem}
.btn.del{background:transparent;border:1px solid rgba(255,107,138,.5);color:var(--bad)}
.btn:disabled{opacity:.6}
.msg{margin-top:16px;padding:13px 16px;border-radius:14px;line-height:1.8;background:rgba(255,107,138,.12);border:1px solid rgba(255,107,138,.35);color:var(--bad)}
.msg.good{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.4);color:var(--ok)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fchip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:.86rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip:hover{border-color:var(--p2);color:var(--text)}
.fchip.on{background:rgba(162,76,240,.24);border-color:var(--p2);color:#fff}
.fchip.bad{border-color:rgba(255,107,138,.45);color:var(--bad)}
.fchip.bad.on{background:rgba(255,107,138,.22);color:#fff}
.fchip.ok{border-color:rgba(74,222,128,.4);color:var(--ok)}
.fchip.ok.on{background:rgba(74,222,128,.2);color:#fff}
.fchip b{background:rgba(0,0,0,.35);padding:1px 8px;border-radius:999px;font-size:.8rem}

.results{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding-left:2px}
.results-title{font-size:.9rem;color:var(--muted);margin:4px 4px 2px}
.res-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:right;color:var(--text);font:inherit}
.res-item:hover,.res-item.active{border-color:var(--p2);background:rgba(162,76,240,.18)}
.res-item b{font-size:1.03rem;display:block;margin-bottom:3px}
.res-item small{color:var(--muted);font-size:.84rem}
.res-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.res-badge{background:var(--field);border:1px solid var(--line);padding:5px 12px;border-radius:10px;font-weight:700;color:var(--gold);white-space:nowrap}

.card{margin-top:20px;border-radius:26px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.top{padding:22px 22px 14px;background:linear-gradient(160deg,rgba(162,76,240,.35),transparent 70%);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card-acts{display:flex;gap:8px;flex-wrap:wrap}
.name{font-size:1.55rem;font-weight:800;margin:0 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.9rem}
.meta span{border:1px solid var(--line);border-radius:8px;padding:3px 10px}

.card-body-split{display:grid;grid-template-columns:1.45fr .85fr;gap:14px;padding:8px 22px 22px;align-items:stretch}
.table-side{min-width:0}
.note-side{display:flex}
.note-box{width:100%;height:100%;min-height:160px;padding:14px 16px;border-radius:18px;background:var(--field);border:1px dashed rgba(245,181,61,.45);font-size:.92rem;line-height:1.75;white-space:pre-wrap;cursor:pointer;transition:.15s}
.note-box:hover{border-color:var(--gold);background:rgba(245,181,61,.06)}
.note-box small{display:block;color:var(--gold);font-size:.84rem;margin-bottom:6px;font-weight:700}
.note-box .empty-note{color:var(--muted);font-size:.86rem}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 0 8px}
.stat{border-radius:16px;background:var(--field);border:1px solid var(--line);padding:13px}
.stat small{display:block;color:var(--muted);font-size:.82rem;margin-bottom:5px}
.stat b{font-size:1.1rem}
.stat.hi{border-color:rgba(162,76,240,.45);background:rgba(162,76,240,.12)}
h3{margin:14px 0 8px;font-size:1rem;color:var(--muted)}
.rows{padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:11px 12px;margin-bottom:8px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
.row .n{color:var(--muted);font-size:.85rem}
.row .d{color:var(--muted);font-size:.88rem;text-align:left}
.row .d small{display:block;color:var(--ok);font-size:.78rem}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.8rem;color:var(--muted)}
.tag.ok{color:var(--ok);border-color:rgba(74,222,128,.4)}
.tag.bad{color:var(--bad);border-color:rgba(255,107,138,.4)}
.total{margin:12px 0 0;padding:18px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(245,181,61,.18),rgba(162,76,240,.18));border:1px solid rgba(245,181,61,.4)}
.total b{font-size:1.5rem;color:var(--gold)}
.form{padding:22px;border-radius:26px;border:1px solid var(--line);background:var(--card)}
.form h2{margin:0 0 16px;font-size:1.2rem}
.f{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.f .full{grid-column:1/-1}
.f label,.irow label{display:block;font-size:.83rem;color:var(--muted);margin-bottom:5px}
.irow{display:grid;grid-template-columns:1fr 1.15fr auto 1.15fr auto;gap:8px;align-items:end;margin-bottom:10px}
.irow .ck{display:flex;align-items:center;gap:5px;padding-bottom:12px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.x{border:1px solid var(--line);background:transparent;color:var(--bad);border-radius:10px;width:40px;height:42px;cursor:pointer;font-size:1.1rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hide{display:none}
.print-head{display:none}

@media(max-width:680px){
  .card-body-split{grid-template-columns:1fr;align-items:start}
  .note-box{min-height:90px}
}
@media(max-width:600px){
  .grid,.f{grid-template-columns:1fr}
  .irow{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:auto 1fr auto}
  .row .d{grid-column:1/-1;text-align:right}
}

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff !important;color:#111 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{max-width:100%;padding:0}
  .sub,.tabs,.search,.filters,.msg,.results,.card-acts,#vForm{display:none !important}
  .note-side.no-note-print{display:none !important}
  h1{font-size:1.3rem;text-align:center;color:#000;margin-bottom:4px}
  .print-head{display:block;text-align:center;font-size:.88rem;color:#555;padding-bottom:12px;margin-bottom:16px;border-bottom:2px solid #222}
  .card{margin-top:0;border:1.5px solid #333;border-radius:12px;background:#fff !important;box-shadow:none}
  .top{background:#f3f4f6 !important;border-bottom:1px solid #ccc;padding:16px 20px}
  .name{color:#000;font-size:1.4rem}
  .meta{color:#333}
  .meta span{border-color:#999;background:#fff;color:#000;font-weight:700}
  .card-body-split{padding:14px 20px 20px;grid-template-columns:1.4fr .85fr}
  .card-body-split.no-note-print{grid-template-columns:1fr}
  .note-box{background:#fffbeb !important;border:1px solid #bbb;color:#000;cursor:default}
  .note-box small{color:#333}
  .grid{padding:0 0 6px}
  .stat{background:#f9fafb !important;border:1px solid #bbb}
  .stat.hi{background:#eef2ff !important;border-color:#94a3b8}
  .stat small{color:#444}
  .stat b{color:#000}
  h3{color:#222;margin:12px 0 8px}
  .row{background:#fff !important;border:1px solid #bbb;color:#000}
  .row .n,.row .d{color:#333 !important}
  .tag{border-color:#888;color:#222}
  .tag.ok{color:#0b6e2e;border-color:#0b6e2e;background:#ecfdf5}
  .tag.bad{color:#b91c1c;border-color:#b91c1c;background:#fef2f2}
  .total{margin:14px 0 0;background:#f3f4f6 !important;border:1.5px solid #333;color:#000}
  .total b{color:#000}
}
</style>
</head>
<body>
<main>
  <h1>پشکنینی عەرز و مەخزەنی گۆڕەپانی بەرهەمە نەوتییەکان</h1>
  <div class="print-head" id="printDate"></div>
  <p class="sub">گەڕان، زیادکردن و دەستکاریکردنی عەرزەکان.</p>
  <div class="tabs">
    <button class="tab on" id="tabSearch" type="button">گەڕان</button>
    <button class="tab" id="tabAdd" type="button">+ عەرزی نوێ</button>
  </div>

  <section id="vSearch">
    <div class="search">
      <input class="in" id="code" type="text" placeholder="ژمارەی عەرز، ناوی کڕیار، یان ژمارەی مۆبایل..." autocomplete="off">
      <button class="btn" id="go" type="button">گەڕان</button>
    </div>

    <div class="filters" id="filterBar">
      <button class="fchip" data-filter="all" type="button">هەموو عەرزەکان <b id="cntAll">-</b></button>
      <button class="fchip bad" data-filter="overdue" type="button">قیستی دواکەوتوو <b id="cntOverdue">-</b></button>
      <button class="fchip" data-filter="unpaid" type="button">پارەی ماوە <b id="cntUnpaid">-</b></button>
      <button class="fchip ok" data-filter="done" type="button">تەواوکراو <b id="cntDone">-</b></button>
    </div>

    <div class="msg hide" id="msg" role="alert"></div>
    <div class="results hide" id="results"></div>

    <section class="card hide" id="card">
      <div class="top">
        <div>
          <h2 class="name" id="cname"></h2>
          <div class="meta"><span id="cplot"></span><span id="cphone"></span><span id="csize"></span></div>
        </div>
        <div class="card-acts">
          <button class="btn eye sm" id="toggleDisc" type="button">چاو: داشکاندن دیارە</button>
          <button class="btn alt sm" id="printBtn" type="button">پرینت</button>
          <button class="btn xl sm" id="excelBtn" type="button">ئێکسل</button>
          <button class="btn alt sm" id="editBtn" type="button">دەستکاری</button>
        </div>
      </div>

      <div class="card-body-split" id="cardBodySplit">
        <div class="table-side">
          <div class="grid">
            <div class="stat"><small>کۆی گشتی پارەی عەرز (50,000$/دۆنم)</small><b id="clandtotal"></b></div>
            <div class="stat"><small>بڕی پارەی دراو (پێشەکی)</small><b id="cpaid"></b></div>
          </div>
          <div class="grid" id="statsGrid">
            <div class="stat" id="discBox"><small>داشکاندن</small><b id="cdisc"></b></div>
            <div class="stat hi" id="afterDiscBox"><small>کۆی گشتی پارە کەم داشکاندن</small><b id="cafterdisc"></b></div>
          </div>

          <h3>قیستەکان</h3>
          <div class="rows" id="rows"></div>

          <div class="total"><span>بڕی پارەی ماوە</span><b id="ctotal"></b></div>
        </div>

        <div class="note-side" id="noteSide">
          <div class="note-box" id="cnoteBox" title="کلیک بکە بۆ نووسین یان دەستکاری تێبینی"><small>تێبینی کڕیار:</small><div id="cnote"></div></div>
        </div>
      </div>
    </section>
  </section>

  <section id="vForm" class="hide">
    <div class="form">
      <h2 id="ftitle">زیادکردنی عەرزی نوێ</h2>
      <div class="f">
        <div><label>ژمارەی عەرز</label><input class="in" id="fcode" type="text" inputmode="numeric" placeholder="101"></div>
        <div><label>ناوی کڕیار</label><input class="in" id="fname" type="text"></div>
        <div><label>ژمارەی مۆبایل</label><input class="in" id="fphone" type="text" inputmode="tel"></div>
        <div><label>دۆنم (قەبارە)</label><input class="in" id="fsize" type="text" placeholder="4D"></div>
        <div><label>بڕی پارەی دراو ($)</label><input class="in" id="fpaid" type="number" min="0"></div>
        <div><label>داشکاندن ($)</label><input class="in" id="fdisc" type="number" min="0"></div>
        <div class="full"><label>تێبینی کڕیار</label><textarea class="in" id="fnote" placeholder="تێبینی لەسەر ئەم کڕیارە / عەرزە بنووسە..."></textarea></div>
      </div>
      <h3 style="margin:20px 0 10px">قیستەکان</h3>
      <div id="frows"></div>
      <button class="btn alt" id="addRow" type="button">+ قیستێکی تر</button>
      <div class="acts">
        <button class="btn" id="save" type="button">پاشەکەوتکردن</button>
        <button class="btn alt" id="cancel" type="button">پاشگەزبوونەوە</button>
        <button class="btn del hide" id="del" type="button">سڕینەوەی عەرز</button>
      </div>
      <div class="msg hide" id="fmsg" role="alert"></div>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, getDocs, collection, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyBw7KESs5Ui7-63QssCeMEj4vyRx1uCe7Q",
  authDomain: "oil-yard.firebaseapp.com",
  projectId: "oil-yard",
  storageBucket: "oil-yard.firebasestorage.app",
  messagingSenderId: "122373673621",
  appId: "1:122373673621:web:d9a2f52db1cf84a65e819c"
}));

const PRICE_PER_DONUM = 50000;

const $ = id => document.getElementById(id);
const norm = s => String(s ?? "").toLowerCase().replace(/ڕ/g,"ر").replace(/ۆ/g,"و").replace(/ێ/g,"ی").replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/ە/g,"ه").replace(/\s+/g,"");
const digits = s => String(s ?? "").replace(/[^\d]/g,"");
const fk = (o,w) => Object.keys(o).find(k => norm(k).includes(norm(w)));
const ek = (o,w) => Object.keys(o).find(k => norm(k) === norm(w));
const num = v => Number(String(v ?? "").replace(/[^\d]/g,"")) || 0;
const donumNum = v => { const m = String(v ?? "").replace(/,/g,"").match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : 0; };
const usd = n => Number(n || 0).toLocaleString("en-US") + "$";
const toISO = s => { const m = String(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : (/^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ""); };
const fmtDate = iso => { if(!iso) return "بێ بەروار"; const [y,m,d] = iso.split("-"); return `${+d}/${+m}/${y}`; };
const t0 = new Date(), today = `${t0.getFullYear()}-${String(t0.getMonth()+1).padStart(2,"0")}-${String(t0.getDate()).padStart(2,"0")}`;
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function normalize(d){
  if(Array.isArray(d.inst)){
    return {
      customer: d.customer || "",
      phone: String(d.phone || ""),
      size: d.size || "",
      paid: num(d.paid),
      discount: num(d.discount),
      note: String(d.note || ""),
      inst: d.inst.map(it => ({
        amount: num(it.amount),
        date: it.date || "",
        done: !!it.done,
        paidDate: it.paidDate || ""
      }))
    };
  }
  const g = w => { const k = fk(d,w); return k ? d[k] : ""; };
  const dk = ["بەروار1","بەروار","بەروار2","بەروار3"];
  const inst = [1,2,3,4].map((n,i) => { const k = ek(d, dk[i]); return { amount:num(g("قیستی"+n)), date:toISO(k ? d[k] : ""), done:false, paidDate:"" }; });
  return { customer:String(g("کڕیار")||""), phone:String(g("مۆبایل")||""), size:String(g("دۆنم")||g("قەبارە")||""), paid:num(g("پارەی دراو")), discount:num(g("داشکاندن")), note:String(g("تێبینی")||""), inst };
}

function calcSummary(d){
  const donums = donumNum(d.size);
  const landTotal = donums * PRICE_PER_DONUM;
  const discount = num(d.discount);
  const paid = num(d.paid);
  const afterDiscount = landTotal - discount;
  const paidInstSum = (d.inst || []).reduce((acc, it) => it.done ? acc + num(it.amount) : acc, 0);
  const remaining = afterDiscount - paid - paidInstSum;
  const hasOverdue = (d.inst || []).some(it => !it.done && it.date && it.date < today && num(it.amount) > 0);
  return { donums, landTotal, discount, afterDiscount, paid, paidInstSum, remaining, hasOverdue };
}

let allCache = null;
let activeFilter = "";
let current = null;
let showDiscount = true;

function applyDiscountUI(){
  $("discBox").classList.toggle("hide", !showDiscount);
  $("afterDiscBox").classList.toggle("hide", !showDiscount);
  $("statsGrid").classList.toggle("hide", !showDiscount);
  $("toggleDisc").textContent = showDiscount ? "چاو: داشکاندن دیارە" : "چاو: داشکاندن شاردراوە";
  $("toggleDisc").classList.toggle("off", !showDiscount);
}

applyDiscountUI();

$("toggleDisc").onclick = () => {
  showDiscount = !showDiscount;
  applyDiscountUI();
};

function showMsg(el, text, good){ el.textContent = text; el.classList.toggle("good", !!good); el.classList.remove("hide"); }
function view(name){
  $("vSearch").classList.toggle("hide", name !== "search");
  $("vForm").classList.toggle("hide", name !== "form");
  $("tabSearch").classList.toggle("on", name === "search");
  $("tabAdd").classList.toggle("on", name === "form");
}

function setActiveFilterBtn(type){
  activeFilter = type;
  document.querySelectorAll(".fchip").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.filter === type);
  });
}

async function fetchAllPlots(force = false){
  if(allCache && !force) return allCache;
  const snap = await getDocs(collection(db, "plot"));
  const list = [];
  snap.forEach(docSnap => {
    const code = docSnap.id;
    const data = normalize(docSnap.data());
    list.push({ code, data, sum: calcSummary(data) });
  });
  list.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
  allCache = list;
  updateFilterCounts(list);
  return list;
}

function updateFilterCounts(list){
  $("cntAll").textContent = list.length;
  $("cntOverdue").textContent = list.filter(x => x.sum.hasOverdue).length;
  $("cntUnpaid").textContent = list.filter(x => x.sum.remaining > 0).length;
  $("cntDone").textContent = list.filter(x => x.sum.remaining <= 0 && x.sum.landTotal > 0).length;
}

function renderResults(matches, label){
  const box = $("results");
  box.innerHTML = `<div class="results-title">${label || (matches.length + " ئەنجام دۆزرایەوە (کلیک بکە بۆ بینین):")}</div>`;
  matches.forEach(item => {
    const s = item.sum || calcSummary(item.data);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "res-item";
    const statusTag = s.hasOverdue
      ? `<span class="tag bad">دواکەوتوو</span>`
      : (s.remaining <= 0 && s.landTotal > 0 ? `<span class="tag ok">تەواو</span>` : "");
    btn.innerHTML = `
      <div>
        <b>${esc(item.data.customer || "بێ ناو")}</b>
        <small>${esc(item.data.phone || "بێ مۆبایل")}${item.data.size ? " • دۆنم: " + esc(item.data.size) : ""} • ماوە: ${usd(s.remaining)}</small>
      </div>
      <div class="res-right">
        ${statusTag}
        <span class="res-badge">عەرز ${esc(item.code)}</span>
      </div>
    `;
    btn.onclick = () => {
      document.querySelectorAll(".res-item").forEach(el => el.classList.remove("active"));
      btn.classList.add("active");
      current = item;
      render();
    };
    box.appendChild(btn);
  });
  box.classList.remove("hide");
}

async function applyFilter(type){
  $("msg").classList.add("hide");
  $("card").classList.add("hide");
  $("results").classList.add("hide");
  $("code").value = "";

  if(activeFilter === type){
    setActiveFilterBtn("");
    return;
  }

  try{
    const list = await fetchAllPlots();
    setActiveFilterBtn(type);
    let filtered = list;
    let title = `هەموو عەرزەکان (${list.length}):`;
    if(type === "overdue"){
      filtered = list.filter(x => x.sum.hasOverdue);
      title = `عەرزە قیست دواکەوتووەکان (${filtered.length}):`;
    } else if(type === "unpaid"){
      filtered = list.filter(x => x.sum.remaining > 0);
      title = `عەرزە پارە ماوەکان (${filtered.length}):`;
    } else if(type === "done"){
      filtered = list.filter(x => x.sum.remaining <= 0 && x.sum.landTotal > 0);
      title = `عەرزە تەواوکراوەکان (${filtered.length}):`;
    }
    if(filtered.length === 0){
      showMsg($("msg"), "هیچ عەرزێک لەم بەشەدا نییە.");
      return;
    }
    renderResults(filtered, title);
  }catch(e){
    showMsg($("msg"), "هەڵە لە هێنانی لیست: " + (e.code || e.message));
  }
}

async function search(query){
  const q = (query ?? $("code").value).trim();
  $("msg").classList.add("hide");
  $("card").classList.add("hide");
  $("results").classList.add("hide");
  setActiveFilterBtn("");

  if(!q){ showMsg($("msg"), "تکایە ژمارەی عەرز، ناوی کڕیار، یان ژمارەی مۆبایل بنووسە."); return; }
  $("go").disabled = true;

  try{
    const qNorm = norm(q);
    const qDigits = digits(q);
    let matches = [];
    let gotAll = false;

    try{
      const list = await fetchAllPlots();
      gotAll = true;
      matches = list.filter(({ code, data }) => {
        const phoneDigits = digits(data.phone);
        const matchCode = code === q || norm(code).includes(qNorm);
        const matchName = qNorm.length > 0 && norm(data.customer).includes(qNorm);
        const matchPhone = qDigits.length >= 3 && phoneDigits.includes(qDigits);
        return matchCode || matchName || matchPhone;
      });
    }catch(listErr){
      const directSnap = await getDoc(doc(db, "plot", q));
      if(directSnap.exists()){
        const data = normalize(directSnap.data());
        matches.push({ code: directSnap.id, data, sum: calcSummary(data) });
      } else if(!/^\d+$/.test(q)){
        throw listErr;
      }
    }

    matches.sort((a, b) => (a.code === q ? -1 : b.code === q ? 1 : a.code.localeCompare(b.code, undefined, { numeric: true })));

    if(matches.length === 0){
      showMsg($("msg"), gotAll ? ("هیچ ئەنجامێک نەدۆزرایەوە بۆ: " + q) : "ئەم ژمارەیە نەدۆزرایەوە.");
      return;
    }

    if(matches.length === 1){
      current = matches[0];
      render();
    } else {
      renderResults(matches);
      if(matches[0].code === q){
        current = matches[0];
        render();
        document.querySelector(".res-item")?.classList.add("active");
      }
    }
  }catch(e){
    showMsg($("msg"), "هەڵە لە پەیوەندی بە داتابەیس: " + (e.code || e.message));
  }finally{
    $("go").disabled = false;
  }
}

function getStatus(it){
  if(it.done) return { text:"دراوە", cls:"ok" };
  if(it.date && it.date < today) return { text:"دواکەوتوو", cls:"bad" };
  return { text:"چاوەڕێ", cls:"" };
}

function render(){
  const { code, data:d } = current;
  const s = calcSummary(d);
  $("cname").textContent = d.customer || "بێ ناو";
  $("cplot").textContent = "عەرز " + code;
  $("cphone").textContent = d.phone; $("cphone").classList.toggle("hide", !d.phone);
  $("csize").textContent = d.size ? "دۆنم: " + d.size : ""; $("csize").classList.toggle("hide", !d.size);

  const hasNote = !!d.note.trim();
  if(hasNote){
    $("cnote").textContent = d.note;
  } else {
    $("cnote").innerHTML = `<span class="empty-note">هیچ تێبینییەک تۆمار نەکراوە.<br>کلیک بکە بۆ زیادکردنی تێبینی.</span>`;
  }
  $("noteSide").classList.toggle("no-note-print", !hasNote);
  $("cardBodySplit").classList.toggle("no-note-print", !hasNote);

  $("clandtotal").textContent = usd(s.landTotal);
  $("cpaid").textContent = usd(s.paid);
  $("cdisc").textContent = usd(s.discount);
  $("cafterdisc").textContent = usd(s.afterDiscount);
  applyDiscountUI();

  const box = $("rows"); box.innerHTML = "";
  d.inst.forEach((it,i) => {
    const amount = num(it.amount);
    const st = getStatus(it);
    const row = document.createElement("div"); row.className = "row";
    const n = document.createElement("span"); n.className = "n"; n.textContent = "قیستی " + (i+1);
    const a = document.createElement("b"); a.textContent = usd(amount);
    const tg = document.createElement("span"); tg.className = "tag" + (st.cls ? " " + st.cls : ""); tg.textContent = st.text;
    const dt = document.createElement("span"); dt.className = "d";
    dt.innerHTML = esc(fmtDate(it.date)) + (it.done && it.paidDate ? `<small>دانەوە: ${esc(fmtDate(it.paidDate))}</small>` : "");
    row.append(n, a, tg, dt); box.appendChild(row);
  });

  $("ctotal").textContent = usd(s.remaining);
  $("card").classList.remove("hide");
}

function printCard(){
  if(!current) return;
  $("printDate").textContent = "بەرواری پرینت: " + fmtDate(today);
  window.print();
}

function exportExcel(){
  if(!current) return;
  const { code, data:d } = current;
  const s = calcSummary(d);
  const instRows = d.inst.map((it, i) => {
    const amount = num(it.amount);
    const st = getStatus(it);
    const bg = st.cls === "ok" ? "#e6f4ea" : (st.cls === "bad" ? "#fce8e6" : "#ffffff");
    const dateInfo = it.done && it.paidDate ? `${fmtDate(it.date)} (دانەوە: ${fmtDate(it.paidDate)})` : fmtDate(it.date);
    return `<tr>
      <td>قیستی ${i + 1}</td>
      <td>${amount.toLocaleString("en-US")}$</td>
      <td style="background:${bg}">${st.text}</td>
      <td>${esc(dateInfo)}</td>
    </tr>`;
  }).join("");

  const discRow = showDiscount
    ? `<tr><td class="lbl">داشکاندن</td><td>${s.discount.toLocaleString("en-US")}$</td><td class="lbl">کۆی گشتی پارە کەم داشکاندن</td><td>${s.afterDiscount.toLocaleString("en-US")}$</td></tr>`
    : "";

  const noteRow = d.note.trim()
    ? `<tr><td class="lbl">تێبینی کڕیار</td><td colspan="3">${esc(d.note)}</td></tr>`
    : "";

  const html = `
  <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="UTF-8">
  <style>
    body{font-family:Tahoma,Arial,sans-serif;direction:rtl}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #666;padding:8px 12px;text-align:right;font-size:13pt}
    th{background:#2a0f55;color:#ffffff;font-weight:bold}
    .lbl{background:#ede9fe;font-weight:bold;width:190px}
    .tot{background:#fef3c7;font-weight:bold;font-size:14pt}
  </style>
  </head>
  <body>
    <table>
      <tr><th colspan="4" style="text-align:center;font-size:15pt">زانیاری عەرزی گۆڕەپانی بەرهەمە نەوتییەکان</th></tr>
      <tr><td class="lbl">ناوی کڕیار</td><td colspan="3"><b>${esc(d.customer || "بێ ناو")}</b></td></tr>
      <tr><td class="lbl">ژمارەی عەرز</td><td>${esc(code)}</td><td class="lbl">دۆنم (قەبارە)</td><td>${esc(d.size || "-")}</td></tr>
      <tr><td class="lbl">ژمارەی مۆبایل</td><td style="mso-number-format:'\\@'">${esc(d.phone || "-")}</td><td class="lbl">بەرواری دابەزاندن</td><td>${esc(fmtDate(today))}</td></tr>
      <tr><td class="lbl">کۆی گشتی پارەی عەرز</td><td>${s.landTotal.toLocaleString("en-US")}$</td><td class="lbl">بڕی پارەی دراو</td><td>${s.paid.toLocaleString("en-US")}$</td></tr>
      ${discRow}
      ${noteRow}
      <tr><td colspan="4"></td></tr>
      <tr><th>قیست</th><th>بڕی پارە</th><th>دۆخ</th><th>بەروار و دانەوە</th></tr>
      ${instRows || '<tr><td colspan="4" style="text-align:center">هیچ قیستێک تۆمار نەکراوە</td></tr>'}
      <tr><td colspan="4"></td></tr>
      <tr class="tot"><td colspan="2">بڕی پارەی ماوە</td><td colspan="2">${s.remaining.toLocaleString("en-US")}$</td></tr>
    </table>
  </body>
  </html>`;

  const blob = new Blob(["\uFEFF" + html], { type: "application/vnd.ms-excel;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (d.customer || "کڕیار").replace(/[\\/:*?"<>|]/g, "").trim();
  a.href = url;
  a.download = `عەرز_${code}_${safeName}.xls`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function addRow(it = {}){
  const r = document.createElement("div"); r.className = "irow";
  r.innerHTML = `<div><label>بڕ ($)</label><input class="in a" type="number" min="0"></div>
    <div><label>بەرواری قیست</label><input class="in d" type="date"></div>
    <label class="ck"><input type="checkbox" class="c"> دراوە</label>
    <div><label>بەرواری دانەوە</label><input class="in pd" type="date"></div>
    <button type="button" class="x" aria-label="لابردن">×</button>`;
  const chk = r.querySelector(".c");
  const pd = r.querySelector(".pd");
  r.querySelector(".a").value = it.amount || "";
  r.querySelector(".d").value = it.date || "";
  chk.checked = !!it.done;
  pd.value = it.paidDate || "";
  chk.onchange = () => { if(chk.checked && !pd.value) pd.value = today; };
  r.querySelector(".x").onclick = () => r.remove();
  $("frows").appendChild(r);
}

function openForm(code, d, focusNote = false){
  const edit = !!code;
  $("ftitle").textContent = edit ? "دەستکاریکردنی عەرزی " + code : "زیادکردنی عەرزی نوێ";
  $("fcode").value = code || ""; $("fcode").readOnly = edit;
  $("fname").value = d?.customer || ""; $("fphone").value = d?.phone || ""; $("fsize").value = d?.size || "";
  $("fpaid").value = d?.paid || ""; $("fdisc").value = d?.discount || ""; $("fnote").value = d?.note || "";
  $("frows").innerHTML = "";
  (d?.inst || [{},{},{},{}]).forEach(addRow);
  $("del").classList.toggle("hide", !edit);
  $("fmsg").classList.add("hide");
  view("form");
  if(focusNote){
    setTimeout(() => { $("fnote").focus(); $("fnote").scrollIntoView({ behavior: "smooth", block: "center" }); }, 50);
  }
}

async function save(){
  const code = $("fcode").value.trim();
  if(!/^\d+$/.test(code)) return showMsg($("fmsg"), "ژمارەی عەرز دەبێت تەنها ژمارە بێت.");
  if(!$("fname").value.trim()) return showMsg($("fmsg"), "ناوی کڕیار بنووسە.");
  const inst = [...document.querySelectorAll("#frows .irow")].map(r => {
    const done = r.querySelector(".c").checked;
    return {
      amount: Number(r.querySelector(".a").value) || 0,
      date: r.querySelector(".d").value,
      done,
      paidDate: done ? r.querySelector(".pd").value : ""
    };
  }).filter(i => i.amount > 0 || i.date);

  const data = {
    customer: $("fname").value.trim(),
    phone: $("fphone").value.trim(),
    size: $("fsize").value.trim(),
    paid: Number($("fpaid").value) || 0,
    discount: Number($("fdisc").value) || 0,
    note: $("fnote").value.trim(),
    inst
  };

  $("save").disabled = true;
  try{
    if(!$("fcode").readOnly){
      const ex = await getDoc(doc(db, "plot", code));
      if(ex.exists() && !confirm("عەرزی " + code + " پێشتر هەیە. دەتەوێت بیگۆڕیت؟")){ return; }
    }
    await setDoc(doc(db, "plot", code), data);
    await fetchAllPlots(true);
    view("search"); $("code").value = code; await search(code);
    showMsg($("msg"), "عەرزی " + code + " پاشەکەوت کرا.", true);
  }catch(e){ showMsg($("fmsg"), "هەڵە لە پاشەکەوتکردن: " + (e.code || e.message)); }
  finally{ $("save").disabled = false; }
}

async function remove(){
  const code = $("fcode").value.trim();
  if(!confirm("دڵنیایت دەتەوێت عەرزی " + code + " بسڕیتەوە؟ ئەم کارە ناگەڕێتەوە.")) return;
  try{
    await deleteDoc(doc(db, "plot", code));
    await fetchAllPlots(true);
    current = null; view("search"); $("card").classList.add("hide"); $("results").classList.add("hide");
    showMsg($("msg"), "عەرزی " + code + " سڕایەوە.", true);
  }catch(e){ showMsg($("fmsg"), "هەڵە: " + (e.code || e.message)); }
}

document.querySelectorAll(".fchip").forEach(btn => {
  btn.onclick = () => applyFilter(btn.dataset.filter);
});

$("go").onclick = () => search();
$("code").addEventListener("keydown", e => { if(e.key === "Enter") search(); });
$("tabSearch").onclick = () => view("search");
$("tabAdd").onclick = () => openForm();
$("printBtn").onclick = printCard;
$("excelBtn").onclick = exportExcel;
$("editBtn").onclick = () => current && openForm(current.code, current.data, false);
$("cnoteBox").onclick = () => current && openForm(current.code, current.data, true);
$("addRow").onclick = () => addRow();
$("save").onclick = save;
$("cancel").onclick = () => view("search");
$("del").onclick = remove;

fetchAllPlots().catch(() => {});
</script>
